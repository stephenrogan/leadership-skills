name: QA

on:
  push:
  pull_request:
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate package structure
        run: python scripts/validate_repo.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Run deterministic smoke evals
        run: python scripts/run_evals.py --summary --output eval-results/smoke-results.json
      - name: Upload eval artifact
        uses: actions/upload-artifact@v4
        with:
          name: smoke-eval-results-${{ matrix.python-version }}
          path: eval-results/smoke-results.json
